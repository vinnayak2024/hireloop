# HireLoop In-Memory H2 Fallback (For instant viva presentation without local PostgreSQL install)

server.port=5000

spring.datasource.url=jdbc:h2:mem:hireloopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Web Console at http://localhost:5000/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

file.upload-dir=./uploads/resumes
